{{- if and (or .Values.direct.kubeconfigSecret .Values.direct.inClusterName) (eq .Values.direct.auth "kubeconfig") (not .Values.apiKey.secret) }}
{{- fail "direct.auth=kubeconfig gives every caller the kubeconfig's permissions: set apiKey.secret so callers must authenticate" }}
{{- end }}
{{- if not (has .Values.direct.auth (list "passthrough" "kubeconfig")) }}
{{- fail "direct.auth must be passthrough or kubeconfig" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: harvester-mcp-server
    app.kubernetes.io/name: harvester-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: harvester-mcp-server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harvester-mcp-server
  template:
    metadata:
      labels:
        app: harvester-mcp-server
        app.kubernetes.io/name: harvester-mcp-server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: harvester-mcp-cert-rotator-sa
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        # If seLinux.enabled is set to true in values.yaml, the container will run as type rancher_aimcp_container_t.
        # Note: https://github.com/rancher/rancher-selinux policy should be installed.
        {{- if .Values.seLinux.enabled }}
        seLinuxOptions:
          type: rancher_aimcp_container_t
        {{- end }}
      volumes:
        - name: tmp-dir
          emptyDir: {}
        {{- if .Values.direct.kubeconfigSecret }}
        - name: direct-kubeconfig
          secret:
            secretName: {{ .Values.direct.kubeconfigSecret }}
        {{- end }}
      containers:
      - image: "{{ template "system_default_registry" . }}{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
        imagePullPolicy: "{{ .Values.mcp.image.pullPolicy }}"
        name: mcp-server
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        {{- if or .Values.mcp.env .Values.apiKey.secret }}
        env:
          {{- with .Values.mcp.env }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if .Values.apiKey.secret }}
          - name: MCP_API_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Values.apiKey.secret }}
                key: {{ .Values.apiKey.secretKey }}
          {{- end }}
        {{- end }}
        ports:
          - containerPort: 9092
        command: ["/usr/local/bin/mcp"]
        args:
          - "serve"
          - "--port"
          - "9092"
          {{- if .Values.insecureSkipTls }}
          - "--insecure"
          {{- end }}
          {{- if .Values.mcp.readOnly }}
          - "--read-only"
          {{- end }}
          {{- if not .Values.rancher.enabled }}
          - "--disable-rancher"
          {{- end }}
          {{- if .Values.direct.kubeconfigSecret }}
          - "--kubeconfig"
          - "/etc/harvester-mcp/direct/{{ .Values.direct.kubeconfigSecretKey }}"
          {{- end }}
          {{- if .Values.direct.inClusterName }}
          - "--in-cluster-name"
          - "{{ .Values.direct.inClusterName }}"
          {{- end }}
          {{- if or .Values.direct.kubeconfigSecret .Values.direct.inClusterName }}
          - "--direct-auth"
          - "{{ .Values.direct.auth }}"
          {{- end }}
          {{- if .Values.log.level }}
          - "--log-level"
          - "{{ .Values.log.level }}"
          {{- end }}
        volumeMounts:
          - name: tmp-dir
            mountPath: /tmp
          {{- if .Values.direct.kubeconfigSecret }}
          - name: direct-kubeconfig
            mountPath: /etc/harvester-mcp/direct
            readOnly: true
          {{- end }}
